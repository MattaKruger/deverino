services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: deverino
      POSTGRES_PASSWORD: deverino
      POSTGRES_DB: deverino
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deverino"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: deverino_test
      POSTGRES_PASSWORD: deverino_test
      POSTGRES_DB: deverino_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deverino_test -d deverino_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  vespa:
    image: vespaengine/vespa:latest
    hostname: vespa
    ports:
      # Query and document API used by harness.yaml retrieval.vespa_url.
      - "8080:8080"
      # Config server used by `vespa deploy`.
      - "19071:19071"
    volumes:
      - vespadata:/opt/vespa/var:Z
      - ./vespa/document_retrieval:/vespa-app:ro,z

volumes:
  pgdata:
    name: deverino_pgdata
  pgdata_test:
    name: deverino_pgdata_test
  vespadata:
    name: deverino_vespadata
