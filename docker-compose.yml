services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: deverino
      POSTGRES_PASSWORD: deverino
      POSTGRES_DB: deverino
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deverino"]
      interval: 5s
      timeout: 5s
      retries: 5

  vespa:
    image: vespaengine/vespa:latest
    hostname: vespa
    ports:
      # Query and document API used by harness.yaml retrieval.vespa_url.
      - "8080:8080"
      # Config server used by `vespa deploy`.
      - "19071:19071"
    volumes:
      - vespadata:/opt/vespa/var
      - ./vespa/document_retrieval:/vespa-app:ro

volumes:
  pgdata:
  vespadata:
