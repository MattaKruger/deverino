services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: deverino
      POSTGRES_PASSWORD: deverino
      POSTGRES_DB: deverino
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deverino"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
