name: mode_toggle
description: Toggle between semantic and deterministic retrieval modes mid-session

steps:
  - input: "/corpus-retrieval"
    expect_stdout_contains: "Active retrieval mode"
  - input: "/corpus-retrieval semantic"
    expect_stdout_contains: "semantic"
  - input: "/corpus-retrieval"
    expect_stdout_contains: "semantic"
  - input: "/corpus-retrieval deterministic"
    expect_stdout_contains: "deterministic"
  - input: "/corpus-retrieval"
    expect_stdout_contains: "deterministic"

assertions:
  - type: retrieval_mode
    expect: "deterministic"
