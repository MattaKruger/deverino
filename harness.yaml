version: 1.1

project:
  id: deverino

llm:
  provider: glm
  model: glm-5.2
  base_url: https://open.bigmodel.cn/api/coding/paas/v4

paths:
  # Engine Paths
  soul: harness_poc/system_prompts/SOUL.md
  # soul_compact: harness_poc/system_prompts/SOUL-compact.md  # uncomment for token-efficient variant
  system_tools: harness_poc/system_tools
  system_skills: harness_poc/system_skills

  # Workspace Paths
  project_skills: skills
  personas: personas
  workflows: workflows
  pipelines: pipelines

runtime:
  database_url: postgresql://deverino:deverino@localhost/deverino
  default_container_image: deverino-python:latest
  container_ttl_seconds: 14400
  max_harness_containers: 5
  chat_history_max_tokens: 24000
  chat_history_recent_turns: 6
  tool_result_max_chars: 12000
  materializer_poll_interval: 30
  materializer_max_event_tokens: 8000
  materializer_token_budget: 1024
  materializer_freeze_threshold: 3
  materializer_freeze_seconds: 300
  materializer_copt_threshold: 0.92
  sub_agent_prompt_max_tokens: 4000

observability:
  logfire: true   # set to true and export LOGFIRE_TOKEN to enable
  logfire_include_content: false

compiler:
  enabled: true           # Background skill compilation on TUI startup
  model: null             # null = use llm.model; "gpt-4o-mini" = override
  provider: null          # null = use llm.provider
  be_enabled: false       # Stage 5: Binding Evidence (LLM prunes spurious contracts)
  rc_enabled: false       # Stage 6: Residual Cleanup (LLM fixes prose-contract mismatches)

tui:
  vim_enabled: true        # Vim-style modal editing in the Textual TUI (F2 toggles at runtime)
  vim_initial_mode: insert  # insert | normal — starting mode when Vim is enabled

retrieval:
  enabled: true
  provider: vespa
  vespa_url: http://localhost:8080
  namespace: deverino
  schema: doc_chunk
  default_hits: 8
  default_mode: hybrid
  chunk_size_chars: 1800
  chunk_overlap_chars: 200
  max_feed_workers: 1
  max_file_bytes: 52428800
  query_timeout_seconds: 5
  auto_index_paths:
    - docs/
  auto_index_ignore_paths:
    - docs/acdl
    - dashboard-ui/node_modules
    - node_modules
    - .venv
    - __pycache__

distiller:
  model: glm/glm-5.2
  max_retries: 3
  prompt_template: distiller_v2          # updated: includes architecture + obsolete
  # prompt_template_compact: distiller_v2_compact  # uncomment for token-efficient variant
  timeout_seconds: 120                   # per-attempt LLM call timeout

cartographer:
  token_budget: 1024
  tokenizer_name: cl100k_base

  # Per-type decay (replaces global recency_bonus/recency_cap/staleness_penalty/staleness_floor)
  staleness_penalty:
    dispute: 0.02
    schema: 0.03
    insight: 0.05
    architecture: 0.01
    boundary: 0.02
    entity: 0.05
    result: 0.10
    constant: 0.01

  staleness_floor:
    dispute: 0.50
    schema: 0.40
    insight: 0.20
    architecture: 0.60
    boundary: 0.30
    entity: 0.20
    result: 0.05
    constant: 0.60

  recency_bonus:
    dispute: 0.01
    schema: 0.01
    insight: 0.01
    architecture: 0.01
    boundary: 0.01
    entity: 0.01
    result: 0.00
    constant: 0.01

  recency_cap:
    dispute: 0.50
    schema: 0.50
    insight: 0.40
    architecture: 0.80
    boundary: 0.30
    entity: 0.50
    result: 0.10
    constant: 0.30

  priority_weights:
    dispute: 1.0
    schema: 0.9
    architecture: 0.85
    insight: 0.8
    boundary: 0.7
    entity: 0.6
    result: 0.5
    constant: 0.4

  section_budget_share:
    context_architecture: 0.25
    parsing_schema: 0.20
    context_understanding: 0.25
    context_roadmap: 0.15
    domain_constants: 0.10
    reusable_results: 0.05

  cross_corpus:
    enabled: true
    related_corpora:
      "deverino:codebase":
        - "deverino:dashboard"
        - "deverino:benchmarks"
    max_cross_entries: 16
    min_priority: 0.7
