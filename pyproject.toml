[project]
name = "llm-agent-harness-poc"
version = "0.1.0"
description = "Proof of concept LLM agent harness backed by PostgreSQL."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.37.0",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.2",
    "tiktoken>=0.7.0",
    "rich>=15.0.0",
    "typer>=0.12.5,<0.25.0", # upper bound required by docling-core
    "pydantic-ai>=1.97.0",
    "logfire[pydantic-ai]>=4.33.0",
    "textual>=1.0.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "polars>=1.40.1",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "pyvespa>=0.43.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sentence-transformers>=5.5.1",
    "pgvector>=0.4.2",
    "tool>=0.8.0",
    "semble>=0.3.4",
    "docling>=2.0.0",
    "docling-core[chunking]>=2.77.0",
    "einops>=0.8.2",
    "pymupdf>=1.27.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: Requires Postgres and Vespa",
    "benchmark: Real-LLM quality benchmark (skipped by default, use --run-benchmarks)",
]

[project.scripts]
harness-poc = "harness_poc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_poc"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# ---------------------------------------------------------------------------
# Rule selection: start from defaults (pyflakes + pycodestyle errors),
# then consciously opt in to additional rule categories.
# This avoids surprise breakage when new rules land in future Ruff releases.
# ---------------------------------------------------------------------------
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "W",     # pycodestyle warnings
    "I",     # isort (import ordering)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modernise syntax for py314)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "PERF",  # perflint (performance anti-patterns)
    "FBT",   # flake8-boolean-trap
    "A",     # flake8-builtins
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "PIE",   # flake8-pie
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "TRY",   # tryceratops
    "FLY",   # flynt (f-strings)
    "PL",    # pylint (all sub-categories)
    "RSE",   # flake8-raise
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "ARG",   # flake8-unused-arguments
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "Q",     # flake8-quotes
    "TC",    # flake8-type-checking
    "ERA",   # eradicate (commented-out code)
    "T20",   # flake8-print
    "PT",    # flake8-pytest-style
    "D",     # pydocstyle (see convention below)
    "TID",   # flake8-tidy-imports
    "S",     # flake8-bandit (security)
    "ANN",   # flake8-annotations
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "T10",   # flake8-debugger (no breakpoint/pdb in production)
    "FURB",  # refurb (modern Python patterns)
    "PGH",   # pygrep-hooks (no eval, blanket except, etc.)
    "FIX",   # flake8-fixme (no TODO/FIXME in production)
]

# ---------------------------------------------------------------------------
# Global ignores – rules we have consciously decided are not a fit for
# this project (REPL tool, POC harness, not a library).
# ---------------------------------------------------------------------------
ignore = [
    "COM812",  # Trailing comma – handled by the formatter
    "D100",    # Missing docstring in public module (app, not a library)
    "D101",    # Missing docstring in public class (app, not a library)
    "D102",    # Missing docstring in public method (app, not a library)
    "D103",    # Missing docstring in public function (app, not a library)
    "D104",    # Missing docstring in public package (app, not a library)
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "T201",    # print() is fine in a REPL / CLI tool
]

# Enable future annotations so TC rules can move more imports into
# TYPE_CHECKING blocks (Python 3.14 defers annotations by default anyway).
future-annotations = true

# ---------------------------------------------------------------------------
# Pydocstyle: use Google convention to resolve D203-vs-D211 and
# D213-vs-D212 conflicts automatically.
# ---------------------------------------------------------------------------
[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# McCabe complexity: raise the threshold instead of disabling C901 entirely.
# ---------------------------------------------------------------------------
[tool.ruff.lint.mccabe]
max-complexity = 15

# ---------------------------------------------------------------------------
# Pylint: raise some thresholds for parser / code-generator style functions.
# ---------------------------------------------------------------------------
[tool.ruff.lint.pylint]
max-returns = 6
max-args = 5
max-branches = 12
max-statements = 50
max-positional-args = 5

# ---------------------------------------------------------------------------
# Per-file ignores – temporary suppressions for files that still need
# refactoring.  D400/D415 were removed from the ACDL files because the
# Google convention already disables those rules.
# ---------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
"fix_pylint.py" = ["ALL"]
"tests/**/*.py" = [
    "S108",
    "PLC0415",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN401",
    "ARG001",
    "ARG002",
    "S101",    # assert is expected in tests
    "PLR2004", # magic-value-comparison
    "SLF001",  # private-member-access
    "FBT001",  # boolean-positional-arg-in-function-definition
    "FBT002",  # boolean-default-value-positional-argument
    "INP001",  # implicit-namespace-package
    "F841",    # unused-variable (common in test setup)
    "RUF006",  # asyncio-dangling-task (common in test cleanup)
    "TC001",   # typing-only-third-party-import
    "TC002",   # typing-only-third-party-import
    "TC003",   # typing-only-standard-library-import
]
"harness_poc/v2/tests/**/*.py" = [
    "S108",
    "PLC0415",
    "ANN002",
    "ANN003",
    "ANN401",
    "S101",
    "PLR2004",
    "SLF001",
    "FBT001",
    "FBT002",
    "S306",
    "F841",
    "RUF006",
    "ERA001",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ARG001",
    "ARG002",
    "D205",
    "TC001",
    "TC002",
    "TC003",
]
"harness_poc/core/context_map/cartographer.py" = ["TC001", "TC003"]
"harness_poc/core/context_map/distiller.py" = ["TC001", "TC002", "TC003"]
"harness_poc/core/context_map/schema.py" = ["TC003"]
"harness_poc/cli.py" = ["PLC0415", "PLR0915"]
"harness_poc/repl.py" = ["PLC0415"]
"harness_poc/v2/wiring.py" = ["PLC0415"]
"harness_poc/v2/execution_engine.py" = ["PLC0415"]
"harness_poc/v2/subscribers/llm_worker.py" = ["PLC0415"]
"harness_poc/core/storage/database.py" = ["PLC0415"]
"harness_poc/core/skills/skill_runner.py" = ["PLC0415"]
"harness_poc/core/context_map/calibrate.py" = ["PLC0415"]
"harness_poc/core/acdl/cli.py" = ["FBT002", "PLC0415"]
"skills/context-map-materializer/skill.py" = ["PLC0415"]
"fix_ann.py" = ["ALL"]
"harness_poc/core/skills/skill_catalog.py" = ["PLW0603", "TC003"]
"harness_poc/core/skills/skill_preprocessing.py" = ["S105", "S603", "S607", "TC003"]
"harness_poc/system_tools/container_destroy.py" = ["ERA001", "TC001"]
"harness_poc/api/routes.py" = ["TC001", "TC002", "ANN202"]
"harness_poc/api/chat.py" = ["TC001", "TC002"]
"harness_poc/system_tools/container_spawn.py" = ["TC001"]
"harness_poc/system_tools/knowledge_tools.py" = [
    "E402",
    "PERF401",
    "PLC0415",
    "PLR0911",
    "PLW0603",
]
"skills/observe/skill.py" = ["PLR0911", "PLR2004"]
"skills/spec_writer/skill.py" = ["TC001", "TC003"]
"tests/runtime/test_container_skills.py" = ["PLC0415"]
"tests/runtime/test_execute_python.py" = ["ARG001", "PLC0415", "PLR0913"]
"tests/runtime/test_pydantic_runtime.py" = ["PLR0913"]
"tests/skills/test_knowledge_tools.py" = ["ARG001", "ARG002", "N817", "PLC0415"]
"scripts/**/*.py" = [
    "S310",   # urllib URL open – scripts hit known APIs (arXiv)
    "S314",   # XML parsing – scripts parse known Atom feeds
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===========================================================================
# Ty – static type checker (Astral, 2026)
# ===========================================================================
# Configuration reference:
#   https://docs.astral.sh/ty/reference/configuration/
# ===========================================================================

[tool.ty]

[tool.ty.rules]
# Strict-by-default: treat most rules as errors.
# Rules that are noisy or have known false positives are set to "warn"
# or "ignore" below.
possibly-unresolved-reference = "error"
possibly-missing-import = "error"
possibly-missing-attribute = "error"
missing-type-argument = "warn"
missing-override-decorator = "warn"

# ---------------------------------------------------------------------------
# Test overrides – relax type checking for test code where spies, mocks
# and fixtures commonly produce invalid-argument-type diagnostics.
# ---------------------------------------------------------------------------
[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
invalid-method-override = "warn"
unresolved-attribute = "warn"

# ---------------------------------------------------------------------------
# ACDL overrides – the parser uses complex recursive types that produce
# false-positive argument-type and return-type diagnostics.
# ---------------------------------------------------------------------------
[[tool.ty.overrides]]
include = ["harness_poc/core/acdl/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
invalid-return-type = "warn"
not-iterable = "warn"
