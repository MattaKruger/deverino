[project]
name = "llm-agent-harness-poc"
version = "0.1.0"
description = "Proof of concept LLM agent harness backed by PostgreSQL."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.37.0",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.2",
    "tiktoken>=0.7.0",
    "rich>=15.0.0",
    "typer>=0.12.5,<0.25.0",  # upper bound required by docling-core
    "pydantic-ai>=1.97.0",
    "logfire[pydantic-ai]>=4.33.0",
    "textual>=1.0.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "polars>=1.40.1",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "pyvespa>=0.43.0",
    "docling>=2.0.0",
    "dash>=4.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: Requires Postgres and Vespa",
    "benchmark: Real-LLM quality benchmark (skipped by default, use --run-benchmarks)",
]

[project.scripts]
harness-poc = "harness_poc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_poc"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "C901",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "TC002", "TC003", "PLR2004", "SLF001", "FBT001", "FBT002", "INP001", "TC001"]
"harness_poc/core/skills/skill_catalog.py" = ["PLW0603", "TC003"]
"harness_poc/core/skills/skill_preprocessing.py" = ["S105", "S603", "S607", "TC003"]
"harness_poc/system_tools/container_destroy.py" = ["ERA001", "TC001"]
"harness_poc/system_tools/container_spawn.py" = ["TC001"]
"harness_poc/system_tools/knowledge_tools.py" = [
    "E402",
    "PERF401",
    "PLC0415",
    "PLR0911",
    "PLW0603",
]
"skills/observe/skill.py" = ["PLR0911", "PLR2004"]
"skills/spec_writer/skill.py" = ["TC001", "TC003"]
"tests/runtime/test_container_skills.py" = ["PLC0415"]
"tests/runtime/test_execute_python.py" = ["ARG001", "PLC0415", "PLR0913"]
"tests/runtime/test_pydantic_runtime.py" = ["PLR0913"]
"tests/skills/test_knowledge_tools.py" = ["ARG002", "N817", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
